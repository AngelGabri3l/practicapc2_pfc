name: CI-CD DevSecOps

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secrets-scan:
    name: Gitleaks (secretos)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  sast-sca:
    name: Bandit (SAST) + pip-audit (dependencias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar herramientas
        run: pip install bandit pip-audit
      - name: Bandit (análisis estático del código)
        run: bandit -r app -ll
      - name: pip-audit (vulnerabilidades en dependencias)
        run: pip-audit -r requirements.txt
  # [jobs-seguridad]
  test:
    name: Pruebas con MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: ci_test_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_root_pw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Ejecutar pruebas (pytest)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: testdb
          DB_USER: testuser
          DB_PASSWORD: ci_test_pw
        run: pytest -v --junitxml=reports/junit.xml
      - name: Resumen de pruebas
        if: always()
        run: python scripts/resumen_pruebas.py
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: reports/junit.xml
          if-no-files-found: warn
  build-scan:
    name: Build, Hadolint y Trivy
    needs: [secrets-scan, sast-sca, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Nombre de imagen (minúsculas)
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Hadolint (lint del Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@v3
      - name: Build (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.vars.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy (falla si hay CRITICAL/HIGH con parche disponible)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.image }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      # [build-push]
  # [jobs-build]
